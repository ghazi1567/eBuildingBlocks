name: Publish eBuildingBlocks.Templates

on:
  push:
    branches:
      - latest-dotnet-10
    paths:
      - 'templates/**'
      - '.github/workflows/publish-eBuildingBlocks-Templates.yml'
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack template
        run: dotnet pack ./templates/eBuildingBlocks.Templates.csproj --configuration Release

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        run: |
          find ./templates/bin/Release -name '*.nupkg' | while read pkg; do
            dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
