name: CI

on:
  push:
    branches:
      - latest-dotnet-10
  pull_request:
    branches:
      - latest-dotnet-10

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./eBuildingBlocks.sln

      - name: Build
        run: dotnet build ./eBuildingBlocks.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./eBuildingBlocks.sln --configuration Release --no-build --verbosity normal
