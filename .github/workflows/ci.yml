name: CI

on:
  push:
    branches:
      - latest-dotnet-10
  pull_request:
    branches:
      - latest-dotnet-10

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./eBuildingBlocks.sln

      - name: Build
        run: dotnet build ./eBuildingBlocks.sln --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test ./eBuildingBlocks.sln --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: './coverage/**/coverage.cobertura.xml'
          targetdir: './coverage/report'
          reporttypes: 'MarkdownSummaryGithub'

      - name: Publish coverage summary
        if: always()
        run: cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
